name: Feature request
description: Suggest an improvement to the chain, SDK, or docs
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SDK (@torium-network/sdk)
        - Chain / node (toriumd)
        - Testnet (torium-testnet-1)
        - Contracts
        - Examples
        - Developer docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you evaluated.
