name: Chain Network Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/chain-network-artifacts.yml"
      - "chain/releases/**"
      - "chain/config/identifiers.json"
      - "chain/config/identifier-availability.json"
      - "chain/config/protocol-v1.json"
      - "chain/config/governance-v1.json"
      - "chain/genesis/localnet/genesis.json"
      - "chain/genesis/localnet/manifest.json"
      - "chain/recovery/recovery-v0.json"
      - "chain/profiles/node-roles-v0.json"
      - "chain/explorer/selection-v1.json"
      - "chain/explorer/stack-v0.json"
      - "contracts/deployments/localnet.json"
      - "packages/torium-sdk/package.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.1"
  PNPM_VERSION: "10.27.0"

concurrency:
  group: torium-network-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate generated network artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root validation dependency
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .

      - name: Validate the committed bundle without starting the chain
        run: node chain/releases/generate-network-artifacts-v0.mjs --check
