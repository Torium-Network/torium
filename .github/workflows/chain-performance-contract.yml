name: Torium Performance Contract

on:
  pull_request:
    paths:
      - ".github/workflows/chain-performance-contract.yml"
      - "chain/performance/**"
      - "chain/app/localnet/runtime_config.go"
      - "chain/config/identifiers.json"
      - "chain/config/protocol-v1.json"
      - "chain/config/rpc-profile-v1.json"
      - "chain/explorer/selection-v1.json"
      - "chain/explorer/stack-v0.json"
      - "chain/observability/observability-v0.json"
      - "chain/profiles/node-roles-v0.json"
      - "chain/recovery/recovery-v0.json"
      - "chain/toolchain.json"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chain-performance-contract.yml"
      - "chain/performance/**"
      - "chain/app/localnet/runtime_config.go"
      - "chain/config/identifiers.json"
      - "chain/config/protocol-v1.json"
      - "chain/config/rpc-profile-v1.json"
      - "chain/explorer/selection-v1.json"
      - "chain/explorer/stack-v0.json"
      - "chain/observability/observability-v0.json"
      - "chain/profiles/node-roles-v0.json"
      - "chain/recovery/recovery-v0.json"
      - "chain/toolchain.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.1"
  PNPM_VERSION: "10.27.0"

concurrency:
  group: torium-performance-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate local performance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root validation dependency
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .

      - name: Validate contracts without starting the chain
        run: |
          node chain/performance/validate-performance-v0.mjs --committed-results
          node --test chain/performance/summarize-samples.test.mjs
