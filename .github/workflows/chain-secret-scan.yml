name: Torium Secret Scan

on:
  pull_request:
    paths:
      - ".github/**"
      - "chain/**"
      - "contracts/**"
      - "packages/torium-sdk/**"
      - "apps/developer-docs/**"
      - "examples/torium/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "chain/**"
      - "contracts/**"
      - "packages/torium-sdk/**"
      - "apps/developer-docs/**"
      - "examples/torium/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.1"

concurrency:
  group: torium-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Repository-wide prohibited-secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Scan every tracked in-scope file with the self-test enabled
        run: node chain/scripts/scan-prohibited-secrets.mjs --self-test
