name: Torium SDK

on:
  pull_request:
    paths:
      - ".github/workflows/torium-sdk.yml"
      - "chain/app/go.mod"
      - "chain/app/go.sum"
      - "chain/config/governance-v1.json"
      - "chain/config/identifiers.json"
      - "chain/config/identifiers.schema.json"
      - "chain/config/validate-identifiers.mjs"
      - "chain/config/protocol-v1.json"
      - "chain/config/rpc-profile-v1.json"
      - "chain/config/rpc-profile-v1.schema.json"
      - "chain/config/validate-rpc-profile-v1.mjs"
      - "chain/config/sdk-policy-v0.json"
      - "chain/config/sdk-policy-v0.schema.json"
      - "chain/config/validate-sdk-policy-v0.mjs"
      - "chain/config/trust-model-v1.json"
      - "chain/app/internal/version/version.go"
      - "chain/app/localnet/recovery_state.go"
      - "chain/app/localnet/recovery_types.go"
      - "chain/app/localnet/runtime.go"
      - "chain/explorer/**"
      - "chain/localnet/RECOVERY.md"
      - "chain/localnet/ACCOUNTS.md"
      - "chain/observability/**"
      - "chain/operator/signer-state-guard.mjs"
      - "chain/operator/signer-state-guard.test.mjs"
      - "chain/operator/VALIDATOR_LIFECYCLE.md"
      - "chain/poc/upstream-baseline/**"
      - "chain/profiles/**"
      - "chain/recovery/**"
      - "chain/security/**"
      - "docs/operations/torium-validator-signer-lifecycle.md"
      - "chain/toolchain.json"
      - "chain/genesis/localnet/genesis.json"
      - "chain/genesis/localnet/manifest.json"
      - "apps/native/package.json"
      - "apps/developer-docs/content/generated/contracts-localnet-foundation.json"
      - "contracts/**"
      - "examples/torium/**"
      - "packages/torium-sdk/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/torium-sdk.yml"
      - "chain/app/go.mod"
      - "chain/app/go.sum"
      - "chain/config/governance-v1.json"
      - "chain/config/identifiers.json"
      - "chain/config/identifiers.schema.json"
      - "chain/config/validate-identifiers.mjs"
      - "chain/config/protocol-v1.json"
      - "chain/config/rpc-profile-v1.json"
      - "chain/config/rpc-profile-v1.schema.json"
      - "chain/config/validate-rpc-profile-v1.mjs"
      - "chain/config/sdk-policy-v0.json"
      - "chain/config/sdk-policy-v0.schema.json"
      - "chain/config/validate-sdk-policy-v0.mjs"
      - "chain/config/trust-model-v1.json"
      - "chain/app/internal/version/version.go"
      - "chain/app/localnet/recovery_state.go"
      - "chain/app/localnet/recovery_types.go"
      - "chain/app/localnet/runtime.go"
      - "chain/explorer/**"
      - "chain/localnet/RECOVERY.md"
      - "chain/localnet/ACCOUNTS.md"
      - "chain/observability/**"
      - "chain/operator/signer-state-guard.mjs"
      - "chain/operator/signer-state-guard.test.mjs"
      - "chain/operator/VALIDATOR_LIFECYCLE.md"
      - "chain/poc/upstream-baseline/**"
      - "chain/profiles/**"
      - "chain/recovery/**"
      - "chain/security/**"
      - "docs/operations/torium-validator-signer-lifecycle.md"
      - "chain/toolchain.json"
      - "chain/genesis/localnet/genesis.json"
      - "chain/genesis/localnet/manifest.json"
      - "apps/native/package.json"
      - "apps/developer-docs/content/generated/contracts-localnet-foundation.json"
      - "contracts/**"
      - "examples/torium/**"
      - "packages/torium-sdk/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.1"
  PNPM_VERSION: "10.27.0"

concurrency:
  group: torium-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify package, types, and tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install SDK and example workspace dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @torium-network/examples...

      - name: Validate SDK policy
        run: node chain/config/validate-sdk-policy-v0.mjs

      - name: Validate canonical chain artifacts
        run: |
          node chain/config/validate-identifiers.mjs
          node chain/config/validate-rpc-profile-v1.mjs
          node chain/profiles/validate-node-roles-v0.mjs
          node chain/explorer/validate-selection-v1.mjs
          node chain/explorer/validate-stack-v0.mjs
          node chain/observability/validate-observability-v0.mjs
          node --test chain/observability/health-exporter.test.mjs
          node chain/recovery/validate-recovery-v0.mjs
          node chain/security/validate-threat-model-v1.mjs
          node chain/security/validate-key-custody-v0.mjs
          node --test chain/operator/signer-state-guard.test.mjs

      - name: Verify contracts workspace
        run: make -C contracts check

      - name: Verify SDK once
        run: pnpm --filter @torium-network/sdk verify

      - name: Verify canonical Node runtime
        run: node packages/torium-sdk/scripts/validate-node-runtime.mjs

      - name: Verify executable example foundations
        run: |
          pnpm --filter @torium-network/examples build
          pnpm --filter @torium-network/examples test
          pnpm --filter @torium-network/examples validate
          node examples/torium/scripts/validate-browser-runtime.mjs
          pnpm --filter @torium-network/examples verify:hermes-runtime

      - name: Switch to Node 24 without repeating full verification
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Verify Node 24 ESM and CommonJS consumption
        run: node packages/torium-sdk/scripts/validate-node-runtime.mjs

      - name: Compile the Foundry example with the pinned tool
        run: |
          FOUNDRY_IMAGE=$(jq -er '.contracts.foundry.image' chain/toolchain.json)
          docker run --rm \
            --volume "$PWD/examples/torium:/workspace:ro" \
            --workdir /workspace/solidity/foundry \
            --entrypoint forge \
            "$FOUNDRY_IMAGE" build \
              --out /tmp/torium-foundry-out \
              --cache-path /tmp/torium-foundry-cache
